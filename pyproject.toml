[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "merlin-llm"
version = "0.1.1"
description = "LLM Attack Surface Framework — the Nikto for OWASP LLM Top 10"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Nicolás Padilla", email = "nicolas@cobalto-sec.tech" },
    { name = "CobaltoSec" }
]
keywords = ["llm", "security", "owasp", "prompt-injection", "red-team", "pentest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    "rich>=13.7.0",
    "PyYAML>=6.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
ollama = ["ollama>=0.3.0"]
claude = ["anthropic>=0.30.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
merlin = "merlin.cli:app"

[project.urls]
Homepage = "https://github.com/CobaltoSec/merlin"
Repository = "https://github.com/CobaltoSec/merlin"
Issues = "https://github.com/CobaltoSec/merlin/issues"
Changelog = "https://github.com/CobaltoSec/merlin/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["merlin*"]
exclude = ["tests*", "labs*", "docs*"]

[tool.setuptools.package-data]
merlin = ["payloads/data/*.yaml", "reporting/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]  # B008: typer requires `= typer.Option(...)` in defaults
